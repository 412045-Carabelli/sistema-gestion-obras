<p-dialog
  (onHide)="close()"
  [(visible)]="visible"
  [closable]="closable"
  [modal]="true"
  [draggable]="false"
  [style]="{width: width}"
  [breakpoints]="{'960px': '90vw', '640px': 'calc(100vw - 3rem)'}"
>
  <ng-template pTemplate="header">
    <span class="font-poppins font-semibold text-xl">{{ title }}</span>
  </ng-template>

  <ng-content></ng-content>

  <ng-template pTemplate="footer">
    @if (viewMode) {
      <div class="flex justify-between items-center gap-2 w-full">
        @if (showDelete) {
          <p-button [label]="deleteLabel" icon="pi pi-trash" severity="danger" [text]="true" [loading]="deleteLoading" (onClick)="deleted.emit()"></p-button>
        } @else {
          <span></span>
        }
        <div class="flex gap-2">
          <p-button label="Cerrar" icon="pi pi-times" severity="secondary" (onClick)="close()"></p-button>
          <p-button [label]="editLabel" icon="pi pi-pencil" severity="info" (onClick)="edit.emit()"></p-button>
        </div>
      </div>
    } @else if (showFooter) {
      <div class="flex justify-end gap-2">
        <p-button label="Cancelar" icon="pi pi-times" severity="secondary" (onClick)="close()"></p-button>
        <p-button [label]="confirmLabel" icon="pi pi-check" (onClick)="confirm()" severity="primary" [disabled]="confirmDisabled" [loading]="confirmLoading"></p-button>
      </div>
    }
  </ng-template>
</p-dialog>
