<header class="ob-header">
  <img src="/buildr-logo.svg" alt="buildrr" class="ob-logo" />

  <div class="ob-stepper">
    <div class="ob-item done">
      <span class="ob-dot">✓</span>
      <span class="ob-label">Crear cuenta</span>
    </div>
    <div class="ob-line" [class.done]="step >= 2"></div>
    <div class="ob-item" [class.active]="step === 2" [class.done]="step > 2">
      <span class="ob-dot">{{ step > 2 ? '✓' : '2' }}</span>
      <span class="ob-label">Elegir plan</span>
    </div>
    <div class="ob-line" [class.done]="step >= 3"></div>
    <div class="ob-item" [class.active]="step === 3">
      <span class="ob-dot">3</span>
      <span class="ob-label">Configurar empresa</span>
    </div>
  </div>

  <button type="button" class="ob-logout" (click)="cerrarSesion()" title="Cerrar sesión">
    <i class="pi pi-sign-out"></i>
    <span class="ob-logout-label">Cerrar sesión</span>
  </button>
</header>
