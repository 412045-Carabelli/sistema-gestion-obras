@if (!isPublicRoute) {
  <app-changelog-modal></app-changelog-modal>
}

<div class="flex flex-col h-screen bg-gray-50">

  @if (!isPublicRoute) {
    @if (showStepper) {
      <!-- 🧭 Stepper de onboarding (reemplaza al navbar durante el alta guiada) -->
      <app-onboarding-stepper [step]="stepperPaso"></app-onboarding-stepper>
    } @else {
      <!-- 🧭 Header -->
      <app-header [showMenuToggle]="!hideSidebar" (toggleMenu)="toggleSidebar()"></app-header>
    }
  }

  <!-- 🧭 Container principal -->
  <div class="flex flex-1 overflow-hidden">

    @if (!isPublicRoute && !hideSidebar) {
      <!-- 📌 Sidebar -->
      <app-sidebar [visible]="sidebarVisible" (navClicked)="isMobile && closeSidebar()"></app-sidebar>
    }

    <!-- 📄 Main Content -->
    <main class="flex-1 overflow-y-auto bg-gray-50 transition-all duration-300">
      <div [@routeFade]="routeAnimCounter">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>

</div>
