<p-toast position="bottom-right"></p-toast>
<p-confirmDialog></p-confirmDialog>

@switch (true) {
  @case (currentRoute === '/movimientos') {
    @if (datosListaCargados) {
      <app-layout-header type="list" title="Movimientos" subtitle="Gestión de cobros y pagos">
        <p-button
          header-actions
          label="Nuevo Movimiento"
          icon="pi pi-plus"
          (click)="abrirNuevoMovimiento()"
          class="btn-mobile-icon"
          styleClass="p-button">
        </p-button>
      </app-layout-header>
    } @else {
      <!-- Loading o placeholder mientras carga el listado -->
      <div class="w-full relative bg-gradient-to-r from-gray-300 to-gray-400 shadow-lg p-8 animate-pulse">
        <div class="space-y-3">
          <div class="h-8 bg-white/30 rounded w-1/3"></div>
          <div class="h-4 bg-white/30 rounded w-1/4"></div>
        </div>
      </div>
    }
  }
  @default {
    <div class="p-4">
      <h1 class="font-poppins text-3xl font-semibold text-gray-800 m-0">Movimientos</h1>
    </div>
  }
}

<div class="p-5 bg-gray-50">
  <router-outlet></router-outlet>
</div>
