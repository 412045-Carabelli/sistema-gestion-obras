<p-toast />

<div class="checkout-page">
  <div class="checkout-glow glow-1"></div>
  <div class="checkout-glow glow-2"></div>

  <div class="checkout-wrapper">
    <div class="checkout-card" *ngIf="!cargando(); else loaderTpl">

      <!-- Columna izquierda: plan -->
      <div class="checkout-col checkout-col-plan">
        <span class="checkout-eyebrow"><span class="eyebrow-dot"></span> Estás por confirmar</span>
        <h2>Plan {{ planDetalle()?.nombre }}</h2>
        <span class="ciclo-badge">{{ ciclo() === 'ANUAL' ? 'Facturación anual' : 'Facturación mensual' }}</span>
        <p class="precio-display">{{ precioDisplay }}</p>
        <p class="precio-nota">{{ precioNota }}</p>
      </div>

      <div class="checkout-divider"></div>

      <!-- Columna derecha: descuento + pago -->
      <div class="checkout-col checkout-col-pago">
        <div class="descuento-section" [formGroup]="form">
          <label for="codigoDescuento">Código de descuento (opcional)</label>
          <input
            id="codigoDescuento"
            type="text"
            formControlName="codigoDescuento"
            placeholder="Ej: LAUNCH50"
            class="input-descuento"
          />
        </div>

        <div class="pago-info">
          <p><i class="pi pi-lock"></i> Pago seguro procesado por Mercado Pago</p>
          <p><i class="pi pi-refresh"></i> Podés cancelar en cualquier momento desde Mi Plan</p>
        </div>

        <div class="checkout-actions">
          <button class="btn-volver" (click)="volver()">
            <i class="pi pi-arrow-left"></i> Volver
          </button>
          <button
            class="btn-pagar"
            (click)="confirmar()"
            [disabled]="procesando()"
          >
            <i class="pi pi-credit-card"></i>
            {{ procesando() ? 'Redirigiendo...' : 'Ir a Pagar con Mercado Pago' }}
          </button>
        </div>
      </div>
    </div>

    <ng-template #loaderTpl>
      <div class="checkout-card cargando">
        <i class="pi pi-spin pi-spinner"></i>
        <p>Cargando información del plan...</p>
      </div>
    </ng-template>
  </div>
</div>
